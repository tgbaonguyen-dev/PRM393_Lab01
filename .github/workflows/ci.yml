name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.component }} checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        component: [frontend, backend]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Detect package
        id: package
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          if [[ ! -d "$COMPONENT" ]]; then
            echo "::error::Missing component directory: $COMPONENT"
            exit 1
          fi
          if [[ -f "$COMPONENT/pubspec.yaml" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Missing $COMPONENT/pubspec.yaml."
            exit 1
          fi

      - name: Set up Flutter
        if: steps.package.outputs.ready == 'true' && matrix.component == 'frontend'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.4'
          cache: true

      - name: Set up Dart
        if: steps.package.outputs.ready == 'true' && matrix.component == 'backend'
        uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.12.2'

      - name: Install dependencies
        if: steps.package.outputs.ready == 'true'
        working-directory: ${{ matrix.component }}
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          if [[ "$COMPONENT" == "frontend" ]]; then
            flutter pub get
          else
            dart pub get
          fi

      - name: Check formatting
        if: steps.package.outputs.ready == 'true'
        working-directory: ${{ matrix.component }}
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        if: steps.package.outputs.ready == 'true'
        working-directory: ${{ matrix.component }}
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          if [[ "$COMPONENT" == "frontend" ]]; then
            flutter analyze --fatal-infos --fatal-warnings
          else
            dart analyze --fatal-infos
          fi

      - name: Run tests when present
        if: steps.package.outputs.ready == 'true'
        working-directory: ${{ matrix.component }}
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          if [[ -d test ]] && [[ -n "$(find test -type f -name '*_test.dart' -print -quit)" ]]; then
            if [[ "$COMPONENT" == "frontend" ]]; then
              flutter test
            else
              dart test
            fi
          else
            echo "::notice::No test/*_test.dart files in $COMPONENT."
            echo "### $COMPONENT: tests not run (no test files)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build Flutter Web
        if: steps.package.outputs.ready == 'true' && matrix.component == 'frontend'
        working-directory: frontend
        run: flutter build web --release
