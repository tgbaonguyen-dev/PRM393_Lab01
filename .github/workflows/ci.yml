name: PRM393 Continuous Integration (CI)

on:
  push:
    branches: [ main, develop, 'feat/**', 'feature/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-analysis:
    name: Backend (Dart Shelf) Analysis & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        working-directory: backend
        run: dart pub get

      - name: Analyze Backend Code
        working-directory: backend
        run: dart analyze --fatal-infos

  desktop-analysis:
    name: Desktop (Flutter) Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: apps/desktop
        run: flutter pub get

      - name: Analyze Desktop Code
        working-directory: apps/desktop
        run: flutter analyze

  web-check:
    name: Web Client (Next.js) Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if Web project exists
        id: check_web
        run: |
          if [ -f "apps/web/package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.check_web.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Web Dependencies
        if: steps.check_web.outputs.exists == 'true'
        working-directory: apps/web
        run: npm install

      - name: Lint Next.js
        if: steps.check_web.outputs.exists == 'true'
        working-directory: apps/web
        run: npm run lint

